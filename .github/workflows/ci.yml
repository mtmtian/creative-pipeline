name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Check public repository contents
        run: python check_public.py
      - name: Compile Python sources
        run: git ls-files -z '*.py' | xargs -0 python -m py_compile
      - name: Run unittest suite
        # Skipping the four media E2E tests is expected without local media tools/model.
        run: python -m unittest discover -v
      - name: Run Seedance text parser tests (no API calls)
        # These are plain functions, so unittest discovery does not execute them.
        run: python test_seedance_gen.py
